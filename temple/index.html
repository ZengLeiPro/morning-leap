<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="晨光神殿 — 手感片：取回晨光核" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>晨光神殿</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="game" width="320" height="180" aria-label="晨光神殿游戏画布"></canvas>
      <div id="ui" class="ui-overlay" aria-live="polite">
        <div id="ui-loading" class="ui-layer ui-loading">加载素材…</div>
        <div id="ui-title" class="ui-layer ui-title hidden">
          <h1 class="ui-title-name">《晨光神殿》</h1>
          <p class="ui-title-sub">取回晨光核</p>
          <div id="ui-title-btns" class="ui-title-btns"></div>
          <div class="ui-title-footer">
            <p class="ui-title-hint">WASD移动 · J/Z挥剑 · E对话</p>
            <p class="ui-title-credit">Art: Kenney.nl · Characters: Shade (Puny)</p>
            <p class="ui-title-credit">Audio: Kenney.nl · Aureolus_Omicron</p>
            <button type="button" id="btn-mute-title" class="ui-btn ui-btn-mute" aria-pressed="false">声音:开</button>
          </div>
        </div>
        <div id="ui-hud" class="ui-layer ui-hud hidden">
          <div id="ui-hud-stats" class="ui-hud-stats"></div>
          <button type="button" id="btn-mute-hud" class="ui-btn-mute-hud" aria-pressed="false" title="静音">声</button>
          <div id="ui-hud-quest" class="ui-hud-quest hidden"></div>
        </div>
        <div id="ui-toast" class="ui-layer ui-toast hidden"></div>
        <div id="ui-dialog" class="ui-layer ui-dialog hidden">
          <div class="ui-dialog-box">
            <div id="ui-dialog-name" class="ui-dialog-name"></div>
            <div id="ui-dialog-body" class="ui-dialog-body"></div>
            <div class="ui-dialog-hint">E / 谈 继续</div>
          </div>
        </div>
        <div id="ui-end" class="ui-layer ui-end hidden">
          <div class="ui-end-panel">
            <h2 class="ui-end-title">早晨回来了</h2>
            <p class="ui-end-sub">晨光核归位。——通关</p>
            <button type="button" class="ui-btn" data-end="new">再走一程</button>
            <button type="button" class="ui-btn" data-end="village">回村闲逛</button>
          </div>
        </div>
      </div>
    </div>
    <div id="touch" class="touch-ui" aria-hidden="true">
      <div id="stick" class="stick">
        <div id="knob" class="knob"></div>
      </div>
      <button type="button" id="btn-sword" class="btn-action">剑</button>
      <button type="button" id="btn-interact" class="btn-action btn-interact">谈</button>
    </div>
  </div>
  <script src="art.js"></script>
  <script src="maps.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
